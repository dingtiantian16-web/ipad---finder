const $=s=>document.querySelector(s),grid=$('#grid'),query=$('#query'),status=$('#status'),heading=$('#heading');
let active='全部',activeYear='全部年份',lastQuery='';
const normalize=t=>String(t).toLocaleLowerCase('zh-CN').trim().replace(/英寸|寸|第|代|年|苹果|平板/g,'').replace(/([a-z])([0-9])/g,'$1 $2').replace(/([0-9])([a-z])/g,'$1 $2').replace(/[-_（）()]/g,' ').replace(/\s+/g,' ');
function score(i,raw){const q=normalize(raw),words=q.split(' ').filter(Boolean),codes=Object.keys(i.codes).join(' ');const searchable=normalize([i.name,i.year,i.series,i.generation,i.size,i.chip,codes,...i.aliases].join(' '));let s=0;i.aliases.forEach(a=>{if(normalize(a)===q)s+=100});if(searchable.includes(q))s+=20;words.forEach(w=>{if(searchable.includes(w))s+=5;if(w===normalize(i.series))s+=10;if(w==i.year)s+=10;if(w===normalize(i.chip))s+=15;if(w==i.size)s+=10;if(w==i.generation)s+=10});return s}
function search(raw){const hit=raw.toUpperCase().match(/\bA?\d{4}\b/);if(hit){const code=hit[0].startsWith('A')?hit[0]:'A'+hit[0];const item=IPADS.find(i=>i.codes[code]);if(item)return [{item,score:999,exact:code}]}
 const ranked=IPADS.map(item=>({item,score:score(item,raw)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||b.item.year-a.item.year);if(!ranked.length)return[];const high=ranked[0].score;return ranked.filter(x=>x.score>=Math.max(high-15,1)).slice(0,10)}
function card({item:i,exact}){const unavailable=lastQuery&&i.series==='Pro'&&i.year<2018;const pencil=lastQuery&&i.first_gen_wired_usb_c;const magnetic=lastQuery&&i.first_gen_magnetic;const secondWired=lastQuery&&i.second_gen_wired_only;const secondGen=lastQuery&&i.second_gen_magnetic_wired&&!i.second_gen_wired_only;return `<article class="card ${exact?'exact':''}"><div class="cardtop"><span class="series">iPad ${i.series}</span><span class="year">${i.year}</span></div><h3>${i.name}</h3>${unavailable?'<div class="notice">⚠ 店铺未售卖此产品</div>':''}${pencil?'<div class="pencilnotice">✎ 支持一代笔线充 · USB-C 接口</div>':''}${magnetic?'<div class="magneticnotice">⌁ 支持一代笔磁吸充</div>':''}${secondGen?'<div class="secondgennotice">⚡ 支持二代笔磁吸充 · Type-C 线充</div>':''}${secondWired?'<div class="secondwirednotice">🔌 仅支持二代笔线充 · USB-C 接口</div>':''}<div class="specs"><div class="spec"><small>尺寸</small><b>${i.size}″</b></div><div class="spec"><small>芯片</small><b>${i.chip}</b></div><div class="spec"><small>版本</small><b>${i.generation}</b></div></div><div class="codes">${Object.entries(i.codes).map(([c,v])=>`<div class="code"><b>${exact===c?'✓ ':''}${c}</b><span>${v}</span></div>`).join('')}</div></article>`}
function render(){let rows;if(lastQuery){rows=search(lastQuery);heading.textContent='查询结果';status.textContent=rows.length?`“${lastQuery}” 找到 ${rows.length} 个匹配型号`:`没有找到“${lastQuery}”对应的型号`}
 else{rows=IPADS.filter(i=>(active==='全部'||i.series===active)&&(activeYear==='全部年份'||String(i.year)===activeYear)).map(item=>({item}));heading.textContent=(active==='全部'?'全部 iPad 型号':`iPad ${active}`)+(activeYear==='全部年份'?'与年份':` · ${activeYear} 年`);status.textContent=`共 ${rows.length} 款，数据覆盖 2010–2026 年，按发布时间排序`}
 grid.innerHTML=rows.length?rows.map(card).join(''):`<div class="empty"><div class="big">⌕</div><h3>暂时没有找到</h3><p>请尝试输入 A2588、Air5、mini6 或 Pro M4。</p></div>`}
const groups=['全部','Pro','Air','mini','iPad'];$('#filters').innerHTML=groups.map(g=>`<button class="filter ${g===active?'active':''}" data-group="${g}">${g}</button>`).join('');
$('#filters').addEventListener('click',e=>{if(!e.target.dataset.group)return;active=e.target.dataset.group;lastQuery='';query.value='';document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.group===active));render()});
const years=[...new Set(IPADS.map(i=>i.year))].sort((a,b)=>b-a);$('#year').innerHTML='<option>全部年份</option>'+years.map(y=>`<option value="${y}">${y} 年</option>`).join('');$('#year').addEventListener('change',e=>{activeYear=e.target.value;lastQuery='';query.value='';render()});
$('#form').addEventListener('submit',e=>{e.preventDefault();lastQuery=query.value.trim();if(lastQuery){render();heading.scrollIntoView({behavior:'smooth',block:'start'})}});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{query.value=b.dataset.q;lastQuery=b.dataset.q;render();heading.scrollIntoView({behavior:'smooth'})});
$('#total').textContent=`2010–2026 · ${IPADS.length} 款设备 · ${IPADS.reduce((n,i)=>n+Object.keys(i.codes).length,0)} 个 A 码`;render();
